name: Sync Changelog to Discord

on:
  push:
    branches:
      - main  # <-- Triggers instantly the exact second you push code to main!
    paths:
      - 'Changelog.md'  # <-- ONLY triggers if Changelog.md itself was modified!
  workflow_dispatch: 

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Latest Changelog Entry
        id: parse_changelog
        run: python .github/workflows/extract_changelog.py

      - name: Send Rich Embed to Discord
        if: steps.parse_changelog.outputs.payload != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINAL_PAYLOAD: ${{ steps.parse_changelog.outputs.payload }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$FINAL_PAYLOAD" \
               $DISCORD_WEBHOOK
