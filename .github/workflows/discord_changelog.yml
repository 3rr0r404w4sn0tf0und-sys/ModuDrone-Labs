name: Sync Changelog to Discord

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Latest Changelog Entry
        id: parse_changelog
        run: python .github/workflows/extract_changelog.py

      - name: Check Cache History
        id: cache-changelog
        uses: actions/cache@v4
        with:
          path: .github/workflows/last_changelog.txt
          key: changelog-${{ hashFiles('Changelog.md') }}
          restore-keys: |
            changelog-

      - name: Send Rich Embed to Discord
        if: steps.cache-changelog.outputs.cache-hit != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMBED_TITLE: ${{ steps.parse_changelog.outputs.title }}
          EMBED_DESC: ${{ steps.parse_changelog.outputs.description }}
        run: |
          # 1. Update state footprint cache verification tracking
          echo "$EMBED_DESC" > .github/workflows/last_changelog.txt

          # 2. Package text payloads securely using robust native json serialization flags
          PAYLOAD=$(jq -n \
            --arg title "$EMBED_TITLE" \
            --arg desc "$EMBED_DESC" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3447003,
                footer: {
                  text: "Automated CAD Sync"
                }
              }]
            }')

          # 3. Deliver package payload over curl execution straight to Discord server
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               $DISCORD_WEBHOOK
