name: Sync Changelog to Discord

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Latest Changelog Entry
        id: parse_changelog
        run: python .github/workflows/extract_changelog.py

      # Cache continues tracking fingerprint to prevent duplicate spam loops
      - name: Check Cache History
        id: cache-changelog
        uses: actions/cache@v4
        with:
          path: .github/workflows/last_changelog.txt
          key: changelog-${{ hashFiles('Changelog.md') }}
          restore-keys: |
            changelog-

      - name: Send Rich Embed to Discord
        if: steps.cache-changelog.outputs.cache-hit != 'true' && steps.parse_changelog.outputs.payload != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINAL_PAYLOAD: ${{ steps.parse_changelog.outputs.payload }}
        run: |
          # 1. Update state footprint cache validation
          echo "$FINAL_PAYLOAD" > .github/workflows/last_changelog.txt

          # 2. Pass the clean payload object string straight to curl
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$FINAL_PAYLOAD" \
               $DISCORD_WEBHOOK
