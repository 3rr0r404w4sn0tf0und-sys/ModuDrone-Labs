name: Sync Changelog to Discord

on:
  push:
    branches:
      - main
    paths:
      - 'Changelog.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Format Grid/Size shorthand into HTML
        run: python .github/workflows/format_changelog.py

      - name: Commit formatted Changelog.md (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Changelog.md; then
            git add Changelog.md
            git commit -m "chore: auto-format Changelog.md images [skip ci]"
            git push
          else
            echo "No formatting changes to commit."
          fi

      - name: Extract and Post Changelog to Discord
        env:
          # Securely passes your repository secret down to the Python script execution layer
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python .github/workflows/extract_changelog.py
