name: Sync Changelog to Discord

on:
  push:
    branches:
      - main     # <--- Add this temporarily
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Latest Changelog Entry
        id: parse_changelog
        run: python .github/workflows/extract_changelog.py

      - name: Restore Last Sent Changelog Cache
        id: cache-changelog
        uses: actions/cache@v4
        with:
          path: .github/workflows/last_changelog.txt
          # Fingerprints the file via cryptographic hash signatures
          key: changelog-${{ hashFiles('Changelog.md') }}
          restore-keys: |
            changelog-

      - name: Send Rich Embed to Discord
        # Only execute if the file changed (cache miss) AND the file isn't empty
        if: steps.cache-changelog.outputs.cache-hit != 'true' && steps.parse_changelog.outputs.description != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMBED_TITLE: ${{ fromJSON(steps.parse_changelog.outputs.title) }}
          EMBED_DESC: ${{ fromJSON(steps.parse_changelog.outputs.description) }}
        run: |
          # 1. Update our state tracking file to lock the cache for future loops
          echo "$EMBED_DESC" > .github/workflows/last_changelog.txt

          # 2. Package text safely into a proper JSON string layout format
          PAYLOAD=$(jq -n \
            --arg title "$EMBED_TITLE" \
            --arg desc "$EMBED_DESC" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: 3447003, # Sleek blue accent aesthetic layout color
                footer: {
                  text: "Automated Cad Sync"
                }
              }]
            }')

          # 3. Post payload string execution out to Discord
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               $DISCORD_WEBHOOK
